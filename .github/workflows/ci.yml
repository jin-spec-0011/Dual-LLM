name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate manifest and inline script syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          node -e "const s=require('fs').readFileSync('index.html','utf8');const m=s.match(/<script type=\"module\">([\s\S]*?)<\/script>/);require('fs').writeFileSync('/tmp/app.mjs',m[1])"
          node --check /tmp/app.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: E2E (mocked APIs)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 1
          BASE_URL=http://127.0.0.1:8765/ node tests/e2e.mjs
